vatebur-message-chat-enhancement:
  admin:
    settings:
      chat-layout:
        label: Messages · Page layout
        help: Switch between a two-column desktop layout and a single-column mobile layout, with a scrolling message pane.
      chat-dialog-list:
        label: Messages · Conversations and header
        help: Style dialog previews, selection, avatars, the back button, and header spacing.
      chat-bubbles:
        label: Messages · Bubbles and media
        help: Style incoming and outgoing messages, avatars, timestamps, images, and video.
      chat-composer:
        label: Messages · Inline reply composer
        help: Type directly at the bottom of a conversation. The editor stays in place after sending.
      theme:
        label: Forum · Warm paper theme and portal
        help: Theme color changes require the Masthead extension to be installed and enabled. Apply the warm paper palette, dark and high-contrast variants, and styles for the Melon portal, navigation, and controls.
      mobile-discussion:
        label: Forum · Mobile discussion pages
        help: Adjust discussion headings, post content, blockquotes, and reply spacing.
      mobile-discussion-list:
        label: Forum · Mobile discussion lists
        help: Adjust lists on the homepage, tag feeds, following, and search results.
      mobile-boards:
        label: Forum · Mobile board directory
        help: Adjust board cards, icons, and directory spacing.
      mobile-profile:
        label: Forum · Mobile user profiles
        help: Adjust avatars, badges, bios, and profile card layout.
      editor-tools:
        label: Editor · Compact shared styles
        help: Adjust editor padding and corners and hide selected rich-text controls. Applies to the Messages editor as well.
      discussion-composer:
        label: Editor · Discussions and replies
        help: Adjust the writing area, action bar, and full-screen layout on mobile.
      masthead-zh-hans:
        label: Masthead · Simplified Chinese translations
        help: Enabled by default. Load 60 Masthead frontend translations for zh-Hans. Disable to use other language packs. Remove the old custom-footer translation patch first, then refresh the forum after saving.
