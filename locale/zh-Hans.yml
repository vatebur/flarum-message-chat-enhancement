vatebur-message-chat-enhancement:
  admin:
    settings:
      chat-layout:
        label: 私信 · 页面布局
        help: 调整桌面双栏、窄屏单栏及消息区滚动。
      chat-dialog-list:
        label: 私信 · 会话列表和标题栏
        help: 调整会话预览、选中态、头像、返回按钮和标题栏间距。
      chat-bubbles:
        label: 私信 · 消息气泡和媒体
        help: 调整收发消息的排版、头像、时间、图片和视频。
      chat-composer:
        label: 私信 · 常驻回复输入栏
        help: 打开会话即可在底部直接输入。发送后输入栏留在原位。
      theme:
        label: 论坛 · 暖纸配色和门户
        help: 主题色修改依赖 Masthead 插件，请先安装并启用。应用暖纸与朱砂配色、明暗和高对比度变体，并调整 Melon 门户、导航和公共控件。
      mobile-discussion:
        label: 论坛 · 移动端帖子正文
        help: 调整主题标题、帖子正文、引用和回复间距。
      mobile-discussion-list:
        label: 论坛 · 移动端主题列表
        help: 调整首页、节点主题、关注和搜索结果列表。
      mobile-boards:
        label: 论坛 · 移动端版块目录
        help: 调整版块卡片、图标和目录间距。
      mobile-profile:
        label: 论坛 · 移动端用户资料
        help: 调整头像、徽章、简介及资料卡布局。
      editor-tools:
        label: 编辑器 · 通用紧凑样式
        help: 调整公共编辑器内距和圆角，收起部分富文本控件。也适用于私信编辑器。
      discussion-composer:
        label: 编辑器 · 发帖和回帖
        help: 调整发帖、回帖的撰写区域、操作栏和移动端全屏布局。

